<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420">
  <title>DNA base pairing</title>
  <desc>A ladder schematic with sugar–phosphate backbones, complementary A–T and C–G pairs, dashed hydrogen bonds, and opposite 5-prime to 3-prime strand directions.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10" fill="#7c3aed"/>
    </marker>
  </defs>
  <g fill="#1e1433" font-size="20" text-anchor="middle">
    <text x="160" y="30">Sugar–phosphate</text>
    <text x="160" y="54">backbones</text>
    <text x="72" y="94">5′</text><text x="248" y="94">3′</text>
    <text x="72" y="324">3′</text><text x="248" y="324">5′</text>
    <text x="160" y="369">Hydrogen bonds</text>
    <text x="160" y="410">Opposite directions</text>
  </g>
  <g fill="none" stroke="#7c3aed" stroke-width="4">
    <path d="M 72 110 V 294 M 248 110 V 294"/>
    <path d="M 44 118 V 280 M 276 280 V 118" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
  <g fill="none" stroke="#76668b" stroke-width="1.5">
    <path d="M 118 63 L 72 110 M 202 63 L 248 110 M 160 347 V 272"/>
  </g>
  <g fill="#ede3ff" stroke="#7c3aed" stroke-width="2">
    <rect x="72" y="117" width="62" height="38" rx="6"/><rect x="186" y="117" width="62" height="38" rx="6"/>
    <rect x="72" y="177" width="62" height="38" rx="6"/><rect x="186" y="177" width="62" height="38" rx="6"/>
    <rect x="72" y="237" width="62" height="38" rx="6"/><rect x="186" y="237" width="62" height="38" rx="6"/>
  </g>
  <g fill="none" stroke="#76668b" stroke-width="2" stroke-dasharray="4 4">
    <path d="M 134 131 H 186 M 134 141 H 186 M 134 186 H 186 M 134 196 H 186 M 134 206 H 186 M 134 251 H 186 M 134 261 H 186"/>
  </g>
  <g fill="#1e1433" font-size="24" font-weight="600" text-anchor="middle">
    <text x="103" y="144">A</text><text x="217" y="144">T</text>
    <text x="103" y="204">C</text><text x="217" y="204">G</text>
    <text x="103" y="264">T</text><text x="217" y="264">A</text>
  </g>
</svg>
